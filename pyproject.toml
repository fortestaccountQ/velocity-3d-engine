[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "engine"
version = "0.1.0"
description = "Modular 3D Engine with C++20 core, Sokol GFX, and Nanobind bindings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Antigravity Engineering Team" }
]

[tool.scikit-build]
cmake.version = ">=3.24"
ninja.version = ">=1.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/engine"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
