[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "velocity-engine"
version = "0.2.0"
description = "Velocity 3D Engine: High-performance C++20 core, Sokol GFX, and Nanobind bindings"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Velocity Engine Contributors" }
]

[tool.scikit-build]
cmake.version = ">=3.24"
ninja.version = ">=1.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/VelocityEngine", "python/velocity", "python/pielosyty"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
